# Mirrors the LIVE Render service (checked via the Render API on 2026-11-02):
# name «language», region frankfurt, plan starter, branch main, autoDeploy on.
# This file is NOT a linked Blueprint — the dashboard is the source of truth;
# keep the two identical by hand (see docs/handbook/HANDBOOK.md §4).
services:
  - type: web
    name: language
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Optional: only needed when GEMINI_API_KEY is stored AES-256-GCM encrypted
      # (iv:tag:ciphertext). Not set on Render (2026-11-02): the key is plaintext.
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Frontend Firebase web config. Vite reads these at BUILD time
      # (npm run build) and bakes them into the SPA bundle via import.meta.env.
      # They are NOT secrets (a Firebase web apiKey only identifies the project;
      # access is governed by Firebase Security Rules + API key restrictions),
      # but they are configured here so nothing is hard-coded in source. Set the
      # real values in the Render dashboard (sync:false = enter per-environment).
      - key: VITE_API_KEY
        sync: false
      - key: VITE_AUTH_DOMAIN
        sync: false
      - key: VITE_PROJECT_ID
        sync: false
      - key: VITE_STORAGE_BUCKET
        sync: false
      - key: VITE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_APP_ID
        sync: false
      # Admin allow-list for the Google sign-in + approval system (build-time,
      # comma-separated Gmail addresses). The owner listed here is auto-approved
      # as admin. Must match the adminEmails() list in firestore.rules.
      - key: VITE_ADMIN_EMAILS
        sync: false
      # Two-way Telegram bot (optional). Set the token in the dashboard to
      # enable; leave unset to keep the bot dormant. See docs/telegram-user-guide.md
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      # «نظارت و سرکشی» (docs/supervisor/README.md). Secrets — set on Render only.
      - key: SUPERVISOR_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: NODE_ENV
        value: production
